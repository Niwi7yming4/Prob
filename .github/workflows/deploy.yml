name: Deploy Vite site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate 48-question safety quiz
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('docs/safety-quiz/index.html', 'utf8');
          const script = html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if (!script) throw Error('Quiz script missing');
          new Function(script);
          const data = JSON.parse(script.match(/const DATA=(\[[^\n]+\]);/)?.[1] || 'null');
          if (!Array.isArray(data) || data.length !== 48) throw Error('Expected 48 questions');
          if (new Set(data.map(x => x.sourceOriginal)).size !== 48) throw Error('Duplicate original images');
          for (const item of data) {
            if (!/^.+\.jpg$/i.test(item.image) || !/^[0123]+$/.test(item.codes)) throw Error('Invalid source data');
          }
          console.log('PASS: 48 unique images and valid inline JavaScript');
          NODE

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
