name: Build study site and sync GitHub Pages files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-study-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Cache public dataset archives
        uses: actions/cache@v4
        with:
          path: .cache/safety
          key: public-safety-data-ultra-v1-roboflow-v28

      - name: Prepare multi-topic image questions
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/build_safety_questions.py

      - name: Validate 48-question safety quiz
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('docs/safety-quiz/index.html', 'utf8');
          const script = html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if (!script) throw Error('Quiz script missing');
          new Function(script);
          const data = JSON.parse(script.match(/const DATA=(\[[^\n]+\]);/)?.[1] || 'null');
          if (!Array.isArray(data) || data.length !== 48) throw Error('Expected 48 questions');
          if (new Set(data.map(x => x.sourceOriginal)).size !== 48) throw Error('Duplicate original images');
          for (const item of data) {
            if (!/^.+\.jpg$/i.test(item.image) || !/^[0123]+$/.test(item.codes)) throw Error('Invalid source data');
          }
          const source = JSON.parse(fs.readFileSync('docs/safety-quiz/data.json', 'utf8'));
          if(source.length !== 48 || new Set(source.map(x => x.category)).size !== 9) throw Error('Expected 48 diverse questions across 9 topics');
          if(new Set(source.map(x => x.source + ':' + x.sourceOriginal)).size !== 48) throw Error('Repeated source photos');
          const yes = source.filter(x => x.correct === '是').length;
          if(yes !== 24) throw Error('Yes/no distribution is not balanced');
          for (const x of source) {
            if (!fs.existsSync('docs/safety-quiz/' + x.image.replace('./', ''))) throw Error('Missing image ' + x.image);
          }
          for (const addon of ['flow-addon.js','data-addon.js']) {
            new Function(fs.readFileSync('docs/safety-quiz/' + addon, 'utf8'));
          }
          const mobileCss = fs.readFileSync('docs/safety-quiz/mobile.css','utf8');
          if (!html.includes('href="./mobile.css"') || !html.includes('class="answer-dock"'))
            throw Error('Mobile quiz layout or source file missing');
          if (!mobileCss.includes('max-width: 720px') || !mobileCss.includes('.answer-dock'))
            throw Error('Mobile-first stylesheet missing');
          console.log('PASS: 48 source images, nine topics, balanced questions and dedicated mobile UI');
          NODE

      - name: Save source-backed quiz images and manifest to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/safety-quiz
          if ! git diff --cached --quiet; then
            git commit -m "Update 48 diverse industrial safety images and study flow"
            git push origin HEAD:main
          else
            echo "Question bank and images are already synchronized"
          fi

