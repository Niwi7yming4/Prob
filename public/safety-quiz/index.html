<title>工業安全與 AI 輔助辨識｜完整實驗流程 Demo</title>
<style>
:root{--navy:#193859;--ink:#15293e;--blue:#1760af;--orange:#f4513a;--pale:#edf4fa;--paper:#fff;--canvas:#f5f7f9;--line:#dce4ec;--muted:#62758a;--radius:14px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--canvas);font-size:17px;line-height:1.65}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}
a{color:var(--blue);text-underline-offset:3px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 5px 22px rgba(25,56,89,.035)}
.hero{max-width:1060px;margin:24px auto}.hero-head{border-left:5px solid var(--orange);padding-left:22px;margin:23px 0 32px}.hero-head strong{color:var(--orange)}.intro-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.intro-grid .card{padding:28px}.intro-grid .card:nth-child(2){background:#eef4fa}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:17px 0}.step{border-top:4px solid var(--blue);background:var(--pale);padding:13px 12px;min-height:85px}.step.ai{border-color:var(--orange);background:#fff2ec}.step small{display:block;font-weight:900;color:var(--blue);font-size:13px}.step b{display:block;font-size:19px;margin:6px 0 4px}.step p{font-size:14px;margin:0;color:var(--muted)}
.big-number{font-size:43px;font-weight:900;line-height:1.1;color:var(--navy)}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin:19px 0}
.metric{padding:15px;background:#eef4fa;border-radius:9px}.metric b{font-size:26px;display:block}.metric span{font-size:13px;color:var(--muted)}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:12px 23px;border:2px solid transparent;border-radius:10px;background:var(--navy);color:white;font-size:17px;font-weight:800;text-decoration:none;transition:transform .15s,background .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}.btn:focus-visible,.answer:focus-visible,.scale-choice:focus-visible{outline:4px solid #91b7e3;outline-offset:2px}
.btn.primary{background:var(--blue)}.btn.secondary{background:white;border-color:#c1cfdc;color:var(--navy)}.btn.warn{background:var(--orange)}.btn.textbtn{background:transparent;color:var(--blue);border-color:transparent}
.button-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.rule{border-left:4px solid var(--orange);padding:12px 15px;background:#fff5ee;font-size:14px;margin-top:21px;color:#633d32}
.quiz-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:16px}.quiz-head h1{font-size:clamp(24px,2.4vw,34px);margin:5px 0 0}.progress-title{font-size:15px;color:var(--muted)}
.progress-bg{height:8px;background:#dfebf4;overflow:hidden;border-radius:99px;margin-bottom:20px}.progress-fill{height:100%;width:0;background:var(--blue);transition:width .25s}
.stage-badges{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#e9f1f9;color:#1a5084;font-size:13px;font-weight:800;padding:5px 12px;border-radius:99px}.pill.dark{background:#f0eee9;color:#40566b}
.workspace{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(370px,.85fr);gap:20px;align-items:start}
.photo-card{padding:16px;position:sticky;top:85px}.photo-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:1px 5px 11px;font-size:14px;color:var(--muted)}
.photo-frame{background:#e8edf1;border-radius:8px;min-height:340px;height:min(63vh,640px);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.photo-frame img{width:100%;height:100%;object-fit:contain;display:block}
.photo-frame.mono img{filter:grayscale(1)}.photo-frame img.loading{opacity:0}
.img-fail[hidden]{display:none!important}.img-fail{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:26px;text-align:center;background:#e8edf1}
.photo-caption{font-size:13px;color:var(--muted);padding:10px 4px 0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
.question-card{padding:clamp(22px,2.7vw,34px)}.stage-label{font-size:13px;font-weight:900;color:var(--blue);margin-bottom:10px}.question-title{font-weight:850;font-size:clamp(24px,2.5vw,33px);line-height:1.5;letter-spacing:-.02em;margin-bottom:20px}.question-title em{font-style:normal;color:var(--navy);text-decoration:underline;text-decoration-color:#ffad9e;text-underline-offset:5px}
.note{font-size:15px;color:var(--muted)}.answer-group{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:21px 0 16px}
.answer{background:white;color:var(--ink);border:2px solid #cbd6e1;border-radius:10px;min-height:84px;font-size:23px;font-weight:900}.answer small{display:block;font-weight:500;font-size:13px;color:var(--muted)}.answer:hover{border-color:var(--blue)}.answer.selected{background:#eaf2fb;border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}.answer:disabled{opacity:1;cursor:default}
.ai-panel{border-left:5px solid var(--blue);background:var(--pale);padding:20px 21px;margin:24px 0;border-radius:3px 9px 9px 3px}.ai-panel .eyebrow{font-size:13px;color:var(--blue);font-weight:900;margin-bottom:4px}.ai-panel .suggest{font-size:28px;font-weight:900;color:var(--navy)}
.ai-panel p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.hint{background:#f1f5f9;padding:12px 15px;border-radius:8px;font-size:14px;margin-top:12px;color:#50657a}
.question-foot{border-top:1px solid var(--line);padding-top:15px;margin-top:17px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.pause-card{max-width:730px;padding:44px;margin:50px auto}.pause-card h1{font-size:37px}
.mini-table{width:100%;border-collapse:collapse}.mini-table th,.mini-table td{padding:13px 15px;border-bottom:1px solid var(--line);text-align:left}.mini-table th{background:var(--navy);color:white;font-size:14px}.mini-table td{font-weight:700}
.survey-wrap{max-width:850px;margin:20px auto}.survey-wrap>.card{padding:27px}.survey-item{border-top:1px solid var(--line);padding:22px 0 20px}.survey-item h3{font-size:19px;margin:0 0 12px}.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.scale-choice{min-width:0;min-height:50px;border:1.5px solid #cbd6e1;border-radius:7px;background:white;font-weight:800}.scale-choice.selected{background:var(--blue);color:#fff;border-color:var(--blue)}.scale-guide{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.summary{max-width:950px;margin:23px auto}.summary>.card{padding:27px}.summ-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:19px 0 25px}.summ-grid>div{background:var(--pale);padding:17px;border-radius:8px}.summ-grid strong{display:block;font-size:31px;color:var(--navy)}.summ-grid span{font-size:13px;color:var(--muted)}
.review-header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin:0 0 18px}.review-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.review-card{overflow:hidden}.review-card img{width:100%;height:195px;object-fit:contain;background:#e9edf1}.review-content{padding:15px}.review-content strong{display:block;font-size:18px;margin:5px 0}.review-content p{font-size:14px;margin:4px 0 9px}.review-content a{font-size:13px;overflow-wrap:anywhere}.review-footer{display:flex;gap:8px;justify-content:center;margin:26px 0}
.footer-note{font-size:13px;color:var(--muted);line-height:1.8;max-width:1100px;margin:38px auto 0;border-top:1px solid var(--line);padding-top:16px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* Mobile-first improvements. CSS order allows question > photo > answers on compact screens. */

.image-dialog{border:0;border-radius:13px;padding:14px;background:#fff;color:var(--ink);width:min(95vw,1100px);max-width:none;max-height:95dvh;overflow:auto;box-shadow:0 30px 100px #0e2b4399}

/* Entire protocol: one consistent overview from entry through the report. */
.flow-guide{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:24px;overflow:hidden}
.flow-guide>summary{list-style:none;cursor:pointer;padding:13px 19px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.flow-guide>summary::-webkit-details-marker{display:none}
.flow-guide>summary b{font-size:16px;color:var(--navy)}
.flow-current{color:var(--muted);font-size:13px;margin-left:13px;font-weight:600}
.flow-more{font-size:12px;color:var(--blue);font-weight:800;white-space:nowrap}
.flow-more::after{content:" ＋"}.flow-guide[open] .flow-more::after{content:" −"}
.flow-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));list-style:none;gap:8px;margin:0;padding:0 18px 17px}
.flow-steps li{min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:10px;background:#f9fbfd}
.flow-steps li.current{border-color:var(--blue);background:#eaf3ff}
.flow-steps li.finished{border-color:#b8cfcc;background:#f0f8f4}
.flow-num{background:#e5ebf2;color:#38546d;border-radius:99px;min-width:32px;height:32px;display:grid;place-items:center;font-weight:900;font-size:13px}
.current .flow-num{color:white;background:var(--blue)}
.finished .flow-num{background:#2b7466;color:white}
.flow-steps strong,.flow-steps small{display:block;line-height:1.3}
.flow-steps strong{font-size:14px}.flow-steps small{font-size:12px;color:var(--muted);margin-top:3px}
.demo-cta{border:1px solid #ecc3b8;background:#fff8f4;border-radius:12px;padding:22px 24px;margin-top:24px}
.demo-cta h2{font-size:22px;margin:5px 0 10px}.demo-cta p{font-size:15px;color:#725449;margin-bottom:13px}
.demo-cta .button-row{margin-top:12px}
.demo-label{font-size:12px;letter-spacing:.06em;font-weight:900;color:#a3402d}
.feedback-item{border-bottom:1px solid var(--line);padding:17px 0 20px}
.feedback-item h3{font-size:19px;margin:0 0 12px}
.feedback-options{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.feedback-options button{font-size:16px;min-height:52px;border:2px solid #cbd6e1;background:white;border-radius:8px;color:var(--ink);font-weight:800}
.feedback-options button.selected{background:var(--navy);border-color:var(--navy);color:white}
.feedback-key{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-top:6px}
.feedback-note{width:100%;border:1px solid #bfcedb;border-radius:9px;min-height:95px;padding:12px 14px;font:inherit;resize:vertical}
.score-trend{margin:18px 0 24px}
.score-row{margin:12px 0}
.score-row>div:first-child{display:flex;justify-content:space-between;gap:8px;font-weight:750;font-size:15px;margin-bottom:5px}
.score-track{height:11px;border-radius:30px;background:#e7eef5;overflow:hidden}
.score-fill{height:100%;background:var(--blue);border-radius:30px}
.score-row.final .score-fill{background:#e16c4c}
.insight-list{display:grid;gap:11px;margin:15px 0}
.insight{border-left:4px solid #98b4d0;background:#f3f7fb;padding:13px 16px;font-size:15px}
.insight strong{display:block;margin-bottom:3px}
@media(max-width:950px){.flow-steps{grid-template-columns:repeat(3,minmax(0,1fr))}}

.leave-dialog{border:0;border-radius:17px;padding:0;width:min(410px,calc(100vw - 36px));max-width:none;box-shadow:0 24px 90px #0e223b70;color:var(--ink);background:#fff}
.leave-dialog::backdrop{background:#0f233d9e}
.leave-dialog-inner{padding:26px}
.leave-dialog h2{font-size:23px;margin:0 0 8px}
.leave-dialog p{font-size:15px;color:var(--muted);line-height:1.5;margin:0 0 22px}
.leave-dialog-actions{display:grid;gap:9px}
.leave-dialog-actions button{min-height:49px;border-radius:9px;font-weight:800;border:1px solid #bdcbd8;font-size:15px;background:#fff;color:var(--navy)}
.leave-dialog-actions .leave-save{background:var(--blue);border-color:var(--blue);color:#fff}
.leave-dialog-actions .leave-discard{color:#a43b30;border-color:#edc5c0;background:#fff8f7}
.leave-dialog-actions button:focus-visible,.session-back:focus-visible{outline:3px solid #91b7e3;outline-offset:2px}
@media(max-width:720px){.leave-dialog{width:min(390px,calc(100vw - 30px))}.leave-dialog-inner{padding:22px}.leave-dialog h2{font-size:22px}}

.tutorial-screen{max-width:760px;margin:0 auto;padding:5px 0 45px}
.tutorial-screen h1{font-size:clamp(22px,4vw,31px);line-height:1.45;margin:10px 0 17px}
.tutorial-picture{position:relative;background:#e8edf2;display:grid;place-items:center;border-radius:12px;overflow:hidden;min-height:270px;height:min(56vh,500px)}
.tutorial-picture img{display:block;width:100%;height:100%;object-fit:contain}
.tutorial-picture span{position:absolute;bottom:10px;left:10px;background:#fff;padding:3px 9px;border-radius:6px;font-size:12px}
.tutorial-answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}
.tutorial-answers button{min-height:65px;border:2px solid #c5d3e2;background:#fff;border-radius:10px;font-weight:900;font-size:23px;color:var(--navy)}
.tutorial-answers button:active{background:#e2eefc}
.tutorial-result{background:#e8f2fb;border-left:5px solid var(--blue);padding:16px;border-radius:8px;margin:14px 0}
.tutorial-result strong{display:block;font-size:18px;margin-bottom:7px}
.tutorial-result p{font-size:14px;margin-bottom:0}
.tutorial-next{width:100%;margin-top:10px}
.tutorial-foot{font-size:12px;color:var(--muted);margin-top:16px}
@media(max-width:720px){body[data-screen="tutorial"] .flow-guide{display:none}.tutorial-screen h1{font-size:22px;margin:5px 0 10px}.tutorial-picture{height:clamp(260px,51dvh,480px)}.tutorial-answers button{min-height:58px}}
.ai-panel .suggest{font-size:32px}
@media(max-width:720px){body[data-screen="quiz"] .question-card>.ai-panel{background:#fff1dc;border:2px solid #e9a33c;border-left:7px solid #d58713;border-radius:12px;display:block;padding:16px 17px;margin:0 0 12px;box-shadow:0 5px 16px #a36f2425}body[data-screen="quiz"] .question-card>.ai-panel .eyebrow{font-size:15px;color:#6f4608;font-weight:900;margin:0 0 4px}body[data-screen="quiz"] .question-card>.ai-panel .suggest{font-size:34px;color:#543305}}

'<div class="workspace"><section class="card photo-card"><div class="photo-top"><strong>'+esc(q.id)+'</strong></div><div id="photoframe" class="photo-frame '+(q.color==="灰階"?"mono":"")+'"><img id="photo" class="loading" alt="工地安全影像 '+esc(q.id)+'" src="'+imgUrl(q.image)+'"><div class="evidence-layer" id="evidenceLayer" hidden></div><button class="zoom-photo" type="button" id="zoomPhoto" aria-label="放大查看照片">放大照片</button><dialog id="imageDialog" class="image-dialog" aria-label="放大查看原始照片"><div class="dialog-top"><strong>照片 '+esc(q.id)+'</strong><button type="button" id="closeZoom">關閉 ×</button></div><img id="zoomImage" alt="放大的工地安全影像 '+esc(q.id)+'"></dialog><div id="photoError" class="img-fail" hidden><strong>照片暫時無法載入</strong><span>請重試。</span><button class="btn secondary" id="retry">重新載入圖片</button></div></div><div class="photo-caption"><span>'+(first?'':'框為來源標註，建議為模擬。')+'</span><span><a href="'+sourceLink(q)+'" target="_blank" rel="noopener noreferrer">圖片來源</a></span></div></section>'+
'<section class="card question-card"><h2 class="question-title">'+esc(q.wording)+'</h2>'+
(first?'':'<div class="ai-panel" role="status"><div class="ai-panel-left"><div class="eyebrow">AI 辨識建議 <small>模擬</small></div><div class="ai-summary">'+esc(summaryEvidence(q))+'</div></div><div class="suggest"><small>建議</small>'+suggestion+'</div></div>')+
'<div class="answer-dock" id="answerDock"><div class="dock-top"><span class="dock-context" id="dockContext">'+(first?"初答":"終答")+'</span><span class="dock-current">'+q.number+' / '+limit+'</span></div><div class="answer-group" role="group" aria-label="選擇答案"><button class="answer" type="button" aria-pressed="false" data-answer="是" aria-label="是，符合敘述">是</button><button class="answer" type="button" aria-pressed="false" data-answer="否" aria-label="否，不符合敘述">否</button></div><button id="commit" type="button" class="btn primary" style="width:100%" disabled>'+(first?"提交初答":"確認並下一題")+'</button></div><div class="question-foot"><span>第 '+q.number+'／'+limit+' 題</span></div></section></div>';
const img=document.querySelector("#photo"),err=document.querySelector("#photoError");let imageReady=false;
function imgSuccess(){imageReady=true;err.hidden=true;img.classList.remove("loading");document.querySelector("#zoomPhoto").hidden=false;if(!first)renderEvidence(q,img,document.querySelector("#evidenceLayer"));}
function imgFail(){imageReady=false;err.hidden=false;img.classList.add("loading");document.querySelector("#zoomPhoto").hidden=true;document.querySelector("#commit").disabled=true;document.querySelector("#dockContext").textContent="圖片未載入，請先重新載入";}
img.onload=imgSuccess;img.onerror=imgFail;if(img.complete){if(img.naturalWidth)imgSuccess();else imgFail();}
window.onresize=()=>{if(!first&&document.querySelector("#photo")===img)renderEvidence(q,img,document.querySelector("#evidenceLayer"));};
document.querySelector("#zoomPhoto").onclick=()=>{const dlg=document.querySelector("#imageDialog"),large=document.querySelector("#zoomImage");large.src=img.src;large.style.filter=q.color==="灰階"?"grayscale(1)":"none";dlg.showModal();};
document.querySelector("#closeZoom").onclick=()=>document.querySelector("#imageDialog").close();
document.querySelector("#imageDialog").onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.close();};
document.querySelector("#retry").onclick=()=>{err.hidden=true;img.src=imgUrl(q.image)+(img.src.includes("?")?"&":"?")+"reload="+Date.now();};
document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>{selected=b.dataset.answer;document.querySelectorAll(".answer").forEach(x=>{const active=x===b;x.classList.toggle("selected",active);x.setAttribute("aria-pressed",String(active));});document.querySelector("#dockContext").textContent=(first?"初答":"終答")+" · 已選 "+selected;document.querySelector("#commit").disabled=!imageReady;});
document.querySelector("#commit").onclick=()=>{if(!selected||!imageReady)return;const elapsed=Date.now()-questionStart;if(first){state.records[state.position]={imageId:q.id,imageFile:q.image,source:q.source,originalImageId:q.sourceOriginal,question:q.wording,category:q.category,color:q.color,aiCondition:q.aiCorrect?"correct":"incorrect",conditionId:q.condition+1,standardAnswer:q.correct,aiAdvice:suggestion,negativeWording:!!q.negativeWording,hasTargetAnnotation:!!q.hasTargetAnnotation,initial:selected,initialMs:elapsed,final:null,finalMs:null};state.phase="second";save();render();}else{const out=state.records[state.position];out.final=selected;out.finalMs=elapsed;out.initialCorrect=out.initial===q.correct;out.finalCorrect=out.final===q.correct;out.changed=out.initial!==out.final;state.position++;state.phase="first";state.screen=state.position===total()?"survey":!isDemo()&&state.position===24?"pause":"quiz";save();render();}};
}
function pause(){main.innerHTML='<section class="card pause-card"><div class="kicker">組間休息</div><h1>已完成 24 題</h1><p>可休息，再繼續下一組。</p><div class="progress-bg"><div class="progress-fill" style="width:50%"></div></div><button class="btn primary" id="resume">繼續作答</button></section>';document.querySelector("#resume").onclick=()=>{state.screen="quiz";save();render();};}
function survey(){
main.innerHTML='<section class="survey-wrap"><div class="kicker">作答結束後 / TRUST SCALE</div><h1>AI 信任程度問卷</h1><p>請回想剛才使用 AI 辨識建議時的感受，依照各句敘述選擇 1～7 分。這份範例採用 Jian 等人（2000）的 12 題量表中文譯述。</p><article class="card"><p class="note">1＝完全不符合　　4＝普通　　7＝非常符合</p><div id="items">'+TRUST.map((t,i)=>'<div class="survey-item"><h3>'+String(i+1).padStart(2,"0")+'. '+esc(t)+'</h3><div class="scale" data-idx="'+i+'">'+Array.from({length:7},(_,k)=>'<button class="scale-choice '+(state.survey[i]===k+1?"selected":"")+'" data-value="'+(k+1)+'" aria-label="第 '+(i+1)+' 題，'+(k+1)+' 分">'+(k+1)+'</button>').join("")+'</div><div class="scale-guide"><span>完全不符合</span><span>非常符合</span></div></div>').join("")+'</div><button class="btn primary" id="finish" style="width:100%" '+(Object.keys(state.survey).length===12?"":"disabled")+'>完成問卷，查看結果</button></article></section>';
document.querySelectorAll(".scale-choice").forEach(b=>b.onclick=()=>{const i=+b.parentElement.dataset.idx;state.survey[i]=+b.dataset.value;b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));document.querySelector("#finish").disabled=Object.keys(state.survey).length!==12;save();});
document.querySelector("#finish").onclick=()=>{if(Object.keys(state.survey).length!==12)return;state.screen="done";state.completedAt=new Date().toISOString();save();render();};
}
function stats(){const a=state.records;let init=0,end=0,changed=0,bad=0,eligible=0;for(const r of a){init+=+!!r.initialCorrect;end+=+!!r.finalCorrect;changed+=+!!r.changed;if(r.aiCondition==="incorrect"&&r.initialCorrect){eligible++;if(!r.finalCorrect)bad++;}}return {init,end,changed,bad,eligible};}
function done(){const x=stats();const allTrust=TRUST.map((_,i)=>i<5?8-state.survey[i]:state.survey[i]);const mean=allTrust.reduce((a,b)=>a+b,0)/12;
main.innerHTML='<section class="summary"><div class="kicker">研究介面範例 · 作答結果</div><h1>48 題判讀已完成</h1><p>下面是本機儲存的作答紀錄摘要。此處的 AI 建議來自實驗條件設定，並不代表任何實際辨識模型的準確度。</p><article class="card"><div class="summ-grid"><div><strong>'+x.init+'/48</strong><span>初答正確</span></div><div><strong>'+x.end+'/48</strong><span>最終正確</span></div><div><strong>'+x.changed+'</strong><span>答案改變次數</span></div><div><strong>'+x.bad+'/'+x.eligible+'</strong><span>受錯誤 AI 建議後改錯</span></div></div><h2 style="margin-bottom:12px">信任量表</h2><p>Jian 12 題平均：<strong>'+mean.toFixed(2)+' / 7</strong>。第 1～5 題已反向計分，作答原始分數仍保留於 JSON 匯出檔中。</p><div class="button-row"><button class="btn primary" id="csv">下載 CSV 作答紀錄</button><button class="btn secondary" id="json">下載 JSON 完整紀錄</button><button class="btn secondary" id="review">核對所有題目來源</button></div><div class="rule">這是前測與介面展示用途；標註品質、影像難度、題目語意與圖像授權，都應在正式施測前重新人工審查。</div></article><div class="button-row"><button class="btn warn" id="reset">清除本機紀錄，重新開始</button></div></section>';
document.querySelector("#csv").onclick=downloadCSV;document.querySelector("#json").onclick=()=>download("industrial-safety-48-records.json",JSON.stringify({...state,summary:x,trustReversed:allTrust,trustAverage:mean},null,2),"application/json;charset=utf-8");
document.querySelector("#review").onclick=()=>{state.screen="review";previewPage=0;render();};document.querySelector("#reset").onclick=reset;
}
function download(name,content,type){const blob=new Blob(["\ufeff",content],{type}),url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function downloadCSV(){const cols=["questionNumber","imageId","imageFile","originalImageId","source","category","question","color","conditionId","aiCondition","standardAnswer","aiAdvice","negativeWording","hasTargetAnnotation","initial","final","initialCorrect","finalCorrect","changed","initialMs","finalMs"];const csv=[cols.join(","),...state.records.map((r,i)=>cols.map(c=>{const v=c==="questionNumber"?i+1:r[c];return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}).join(","))].join("\r\n");download("industrial-safety-48-responses.csv",csv,"text/csv;charset=utf-8");}
function reset(){if(!confirm("確定刪除本機儲存的所有作答紀錄，重新開始？"))return;localStorage.removeItem(STORE);state=fresh();render();}
function review(){
const n=12,start=previewPage*n,items=BASE.slice(start,start+n);
main.innerHTML='<section><div class="review-header"><div>'+txtStatus()+'<h1 style="margin:9px 0 0">題庫照片與標註核對</h1><p style="margin:8px 0 0">48 張不同來源影像，依資料庫標註產生是／否問題，正式施測前仍須人工核對圖片及答案。</p></div><button class="btn secondary" id="leave">返回'+(state.records.length?"作答進度":"開始頁")+'</button></div><div class="review-grid">'+items.map((q,i)=>'<article class="card review-card"><img alt="題庫照片 '+q.id+'" loading="lazy" src="'+imgUrl(q.image)+'"><div class="review-content"><span class="pill">'+q.id+'</span><strong>第 '+(start+i+1)+' 張｜'+q.category+'</strong><p>'+esc(q.wording)+'</p><p><b>依標註推定：</b>'+q.correct+'　<span style="color:var(--muted)">標註類別 '+esc(q.className||q.codes)+'</span></p><a href="'+sourceLink(q)+'" target="_blank" rel="noopener noreferrer">查看來源資料庫與標註說明</a></div></article>').join("")+'</div><div class="review-footer"><button class="btn secondary" id="prev" '+(previewPage===0?"disabled":"")+'>上一頁</button><span style="align-self:center;font-weight:800">'+(previewPage+1)+' / 4</span><button class="btn primary" id="next" '+(previewPage===3?"disabled":"")+'>下一頁</button></div></section>';
document.querySelector("#prev").onclick=()=>{previewPage--;review();scrollTo(0,0);};document.querySelector("#next").onclick=()=>{previewPage++;review();scrollTo(0,0);};document.querySelector("#leave").onclick=()=>{state.screen=state.position===24?"pause":state.position>=48?(Object.keys(state.survey).length===12?"done":"survey"):state.position>0?"quiz":"intro";render();};
}
function hasProgress(mode){
 const st=restore(mode);
 return st.screen==="tutorial"||st.tutorialIndex>0||st.position>0||st.phase==="second"||st.records.length>0||Object.keys(st.survey||{}).length>0||Object.keys(st.feedback||{}).length>0||st.screen==="done";
}
function resetMode(mode){
 localStorage.removeItem(mode==="demo"?DEMO_STORE:STORE);
 state=fresh(mode);
 state.screen="intro";
 save();render();
}
let exitRequest={kind:"exit",mode:null};
function openExitDialog(kind="exit",mode=state.mode){
 exitRequest={kind,mode};
 const dlg=document.querySelector("#leaveDialog"),title=document.querySelector("#leaveTitle"),note=document.querySelector("#leaveText");
 const keep=document.querySelector("#leaveKeep"),discard=document.querySelector("#leaveDiscard");
 if(kind==="restart"){
   title.textContent=mode==="demo"?"重做 4 題 Demo？":"重做 48 題？";
   note.textContent="這個模式的作答紀錄會清除。";
   keep.hidden=true;
   discard.textContent="清除並重做";
 }else{
   title.textContent="要離開作答嗎？";
   note.textContent="可保留進度，或放棄這次作答。";
   keep.hidden=false;
   discard.textContent="放棄並重做";
 }
 dlg.showModal();
}
function closeExitDialog(){document.querySelector("#leaveDialog").close();}
document.querySelector("#sessionBack").onclick=()=>openExitDialog();
document.querySelector("#leaveStay").onclick=closeExitDialog;
document.querySelector("#leaveKeep").onclick=()=>{
 closeExitDialog();
 state.returnScreen=state.screen;
 state.screen="intro";save();render();
};
document.querySelector("#leaveDiscard").onclick=()=>{
 const {mode,kind}=exitRequest;closeExitDialog();
 resetMode(mode);
 if(kind==="restart")startMode(mode);
};
document.querySelector("#leaveDialog").onclick=e=>{if(e.target===e.currentTarget)closeExitDialog();};
const footer=document.createElement("footer");footer.className="footer-note shell";footer.innerHTML='<strong>資料來源：</strong> <a href="https://docs.ultralytics.com/datasets/detect/construction-ppe/" target="_blank" rel="noopener noreferrer">Ultralytics Construction-PPE</a>（AGPL-3.0）與 <a href="https://universe.roboflow.com/roboflow-universe-projects/construction-site-safety/dataset/28" target="_blank" rel="noopener noreferrer">Roboflow Construction Site Safety</a>（標示 CC BY 4.0；原始影像授權仍須逐檔核實）。研究流程為課程原型；作答資料僅儲存在本機瀏覽器，不會自動上傳。';document.body.append(footer);
if(new URLSearchParams(location.search).has("review")){state.screen="review";}if(state.screen!=="tutorial")render();
</script><script src="./visual-tutorial.js"></script><script src="./flow-addon.js"></script><script src="./data-addon.js"></script></body></html>
